name: Ecobadge
description: "App do projeto ecobadge"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^3.5.6
  http: ^1.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/eco1.png
    - assets/eco2.png
    - assets/eco3.png





